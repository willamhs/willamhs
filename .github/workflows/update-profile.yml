name: Profile checks and daily refresh

on:
  schedule:
    # 06:17 America/Lima (UTC-5), away from the top of the hour.
    - cron: '17 11 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - 'requirements*.txt'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline tests and validate local assets
        run: |
          python -m pytest -q
          python scripts/validate_profile.py

  refresh:
    needs: validate
    if: >-
      github.repository == 'willamhs/willamhs' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install API dependency
        run: python -m pip install 'requests>=2.32.4,<3'
      - name: Fetch complete snapshot and regenerate dynamic content
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_projects.py
      - name: Validate generated resources
        run: python scripts/validate_profile.py
      - name: Commit and push only when generated content changes
        run: |
          git add -- README.md assets/projects/snapshot.json assets/stats/
          if git diff --cached --quiet; then
            echo "Public metadata is unchanged. No commit needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): refresh public projects and activity'
          git push origin "HEAD:${GITHUB_REF_NAME}"
